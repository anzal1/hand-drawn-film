<!doctype html>
<meta charset="utf-8">
<title>Cat and mug · sketch.js study</title>
<style>body{margin:0;background:#242321;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}</style>
<canvas id="c"></canvas>
<script src="../assets/core.js"></script>
<script src="../assets/studio.js"></script>
<script src="../assets/cels.js"></script>
<script src="../assets/sketch.js"></script>
<script>
'use strict';
// A cat, a mug, a table. The study for sketch.js: drawings authored as SVG path data,
// a draw-on opening, paper fills so the cat hides the window behind it, boiling holds,
// spacing charts for the reach and a ballistic fall. ?pose=NAME shows one key drawing.
const LOOK = new URLSearchParams(location.search).get('look') || 'pencil';
const INK = LOOK === 'pencil' ? '#3a322b' : '#26221f', WEIGHT = LOOK === 'pencil' ? 1.9 : 1.15, VALUE = LOOK === 'pencil' ? 1.35 : 1;
const P = [[0,.12],[.14,.85],[.45,1],[.8,.7],[1,.08]];

// ---------- the set: table, window, mug (fixed drawings) ----------
// World units: 1920 x 1080. The table top is y = 700 and ends at x = 1430.
const SET = svgCel({
  'window/frame': {d:'M 760 -620 L 760 -170 L 1330 -170 L 1330 -620 Z', width:1.5, opacity:.55},
  'window/cross': {d:'M 1045 -615 L 1045 -175 M 766 -395 L 1324 -395', width:1.1, opacity:.45},
  'window/sill': {d:'M 735 -170 L 1355 -170 M 742 -156 L 1348 -156', width:1.3, opacity:.5},
  'window/hill': {d:'M 766 -250 C 860 -300 960 -292 1045 -262 C 1140 -232 1230 -240 1324 -290', width:.9, opacity:.35},
  'window/cloud': {d:'M 1130 -520 C 1128 -548 1168 -556 1178 -534 C 1192 -556 1236 -548 1232 -520 C 1250 -514 1244 -494 1226 -494 L 1140 -494 C 1118 -494 1114 -516 1130 -520', width:.9, opacity:.35},
  'table/top': {d:'M 200 0 L 1430 0', width:2.3},
  'table/edge': {d:'M 206 22 L 1426 22', width:1.2, opacity:.6},
  'table/end': {d:'M 1430 0 L 1426 22', width:1.4, opacity:.8},
  'table/legL': {d:'M 290 24 L 300 380', width:1.8, opacity:.8},
  'table/legR': {d:'M 1350 24 L 1340 380', width:1.8, opacity:.8},
  'floor': {d:'M 0 382 C 500 376 1300 386 1920 380', width:1, opacity:.35},
  'plant/leaf1': {d:'M 560 -96 C 520 -150 520 -214 552 -250 C 580 -200 584 -140 560 -96', width:1.5, fill:'paper'},
  'plant/leaf2': {d:'M 566 -96 C 600 -140 648 -168 690 -160 C 668 -120 620 -96 566 -96', width:1.5, fill:'paper'},
  'plant/leaf3': {d:'M 562 -96 C 548 -150 566 -196 600 -222 C 612 -176 596 -130 562 -96', width:1.4, fill:'paper'},
  'plant/vein': {d:'M 560 -100 C 552 -150 552 -200 552 -240 M 570 -100 C 610 -128 640 -146 676 -158', width:.8, opacity:.55},
  'plant/pot': {d:'M 510 -96 L 616 -96 L 600 -4 L 526 -4 Z', width:1.8, fill:'paper', corner:.9},
  'plant/rim': {d:'M 504 -96 L 622 -96 L 620 -80 L 506 -80 Z', width:1.4, fill:'paper', corner:.9},
}, {pressure:P, offset:[0, 700]});
</script>
<script src="cat/cat-kit.js"></script>
<script>
'use strict';

// ---------- performance: one exposure sheet for the cat ----------
// Each line is a directorial choice: holds boil on fours, moves on twos, the swipe on ones.
const IN = 1.7;                                   // the draw-on opening lasts this long
const X0 = 1290, NUDGE = 44;                      // the mug's rest place and first nudge
const sb = sheetBuilder({library:RAW})
  .key('sit', 1).hold('sit', 23, {boil:3, every:4, keep:['eye']})
  .put('blink', 3).hold('sit', 13, {boil:3, every:4, seed:5, keep:['eye']})
  .mark('notice').between('sit', 'look', spacing(3, 'slowInOut'), 2).key('look', 5).hold('look', 12, {boil:3, every:4, keep:['eye']})
  .between('look', 'raise', spacing(2, 'slowIn'), 2).key('raise', 5)
  .between('raise', 'reach', spacing(2, 'slowOut'), 1).key('reach', 1).mark('nudge')
  .between('reach', 'push', [.6], 1).key('push', 5)
  .between('push', 'look', spacing(3, 'slowInOut'), 2).hold('look', 10, {boil:3, every:4, seed:9, keep:['eye']})
  .mark('turn').put('three', 2).key('cam', 12).mark('stare').hold('cam', 14, {boil:3, every:4, keep:['eye/l', 'eye/r']})
  .put('camshut', 9).hold('cam', 16, {boil:3, every:4, seed:3, keep:['eye/l', 'eye/r']})
  .put('three', 2).hold('look', 3)
  .between('look', 'push', spacing(1, 'slowOut'), 1).mark('shove').hold('push', 3)
  .between('push', 'watch', spacing(2, 'slowIn'), 2).key('watch', 4).hold('watch', 22, {boil:3, every:4, keep:['eye']})
  .mark('turn2').put('three', 2).hold('cam', 30, {boil:3, every:4, seed:7, keep:['eye/l', 'eye/r']})
  .put('camshut', 7).hold('cam', 30, {boil:3, every:4, seed:8, keep:['eye/l', 'eye/r']});
const CAT = sb.build(), T = m => IN + CAT.time(m), DUR = IN + CAT.duration;
const DSET = compileCel(SET, {id:'set'}), DMUG = compileCel(MUG, {id:'mug'});
const DCAT0 = CAT.drawings.sit;

// ---------- the mug: nudged, then shoved off the edge; its motion is physics, not keys ----------
const EDGE = 1430, V0 = 520, DEC = 640, G = 4200, SPIN = 5.2;
const tEdge = (V0 - Math.sqrt(V0 * V0 - 2 * DEC * (EDGE - X0 - NUDGE))) / DEC, VE = V0 - DEC * tEdge;
function mugAt(t) {
  const tn = T('nudge'), ts = T('shove');
  if (t < tn) return {x:X0, y:700, rot:0, fall:false};
  if (t < ts) return {x:X0 + NUDGE * easeOut(clamp((t - tn) / .22, 0, 1)), y:700, rot:0, fall:false};
  const u = t - ts;
  if (u < tEdge) return {x:X0 + NUDGE + V0 * u - DEC * u * u / 2, y:700, rot:0, fall:false};
  const v = u - tEdge;                                          // over the edge: it pivots, then falls free
  return {x:EDGE + VE * v, y:700 + G * v * v / 2, rot:Math.min(SPIN * v * (1 + v * 2), 2.6), fall:true, v};
}
const tLand = T('shove') + tEdge + Math.sqrt(2 * 382 / G);        // floor is 382 below the table top
// steam: three boiled drawings cycling on fours, attached to the mug
const STEAM = boilCels(svgCel({
  'steam/1': {d:'M -14 -110 C -26 -134 -2 -150 -14 -176 C -24 -196 -6 -208 -12 -226', width:1.1, opacity:.5},
  'steam/2': {d:'M 12 -114 C 2 -136 24 -154 12 -180 C 4 -196 18 -206 14 -218', width:1, opacity:.42},
}, {pressure:P, points:24}), 3, {amp:4, pin:false, freq:1.2}).map((r, k) => compileCel(r, {id:'steam' + k}));
// the crash, off the bottom of the frame: two drawn bursts on twos
const BURST = [0, 1].map(k => compileCel(svgCel(Object.fromEntries(Array.from({length:7}, (_, i) => {
  const a = -Math.PI * (.12 + .76 * i / 6), r0 = 40 + k * 30, r1 = 110 + k * 50 + (i % 2) * 30;
  return ['burst/' + i, {d:`M ${f(Math.cos(a) * r0)} ${f(Math.sin(a) * r0)} L ${f(Math.cos(a) * r1)} ${f(Math.sin(a) * r1)}`, width:2.2}];
})), {pressure:P}), {id:'burst' + k}));

// ---------- the shot ----------
const opt = {material:LOOK, color:INK, weight:WEIGHT, value:VALUE};
function shot(c, t) {
  paper(c, '#f4efe3', null, 87);
  // camera on ones: framed on the table, a slow push while the cat holds our gaze
  const push = sm(T('stare') - .2, T('stare') + 1.6, t, easeInOutSine) - sm(T('turn2') - .4, T('turn2') + .6, t, easeInOutSine) * .6;
  c.save(); cam(c, lerp(1090, 1150, push), lerp(520, 470, push), lerp(1.34, 1.52, push));
  const d = twos(t);                                            // draw-on and props on twos
  drawCel(c, DSET, {...opt, reveal: sm(0, IN * .75, d, x => x)});
  const m = mugAt(t < T('shove') ? d : t);                      // the fall is on ones
  if (m.y < 1300) {
    c.save(); c.translate(m.x, m.y);
    if (m.fall) { c.translate(44, 0); c.rotate(m.rot); c.translate(-44, 0); }   // pivot on the front of the base
    if (!m.fall && t > IN * .5) drawCel(c, STEAM[Math.floor(t * 6) % 3], {...opt, reveal: sm(IN * .5, IN * 1.1, d, x => x)});
    drawCel(c, DMUG, {...opt, reveal: sm(IN * .3, IN * .9, d, x => x)});
    if (m.fall && m.v < .12) { c.globalAlpha = .45; drawCel(c, DMUG, {...opt}); c.globalAlpha = 1; }
    c.restore();
  }
  c.save(); c.translate(1030, 700);
  if (t < IN) drawCel(c, DCAT0, {...opt, reveal: sm(IN * .35, IN, d, x => x)});
  else { const q = CAT.at(t - IN); c.translate(...q.place); drawCel(c, q.drawing, opt); }
  c.restore();
  // speed lines behind the falling mug, then the crash burst at the bottom of the frame
  if (m.fall && m.y < 1100) { c.save(); c.strokeStyle = INK; c.lineCap = 'round'; for (let k = 0; k < 3; k++) { c.globalAlpha = .35; c.lineWidth = 1.6; c.beginPath(); c.moveTo(m.x - 20 + k * 22, m.y - 120 - k * 10); c.lineTo(m.x - 20 + k * 22, m.y - 190 - k * 16); c.stroke(); } c.restore(); }
  c.restore();
  const b = t - tLand;
  if (b > 0 && b < .5) { c.save(); resetT(c); c.translate(1560, H + 20); drawCel(c, BURST[Math.floor(b * 12) % 2], {...opt, weight:WEIGHT * 1.3}); c.restore(); }
}

// ---------- score: every cue is read from the sheet marks ----------
function score(ac, t0, out) {
  const bus = ac.createGain(); bus.gain.value = .8; bus.connect(out);
  for (let k = 0; k < 16; k++) noiseBurst(ac, bus, t0, k * IN / 18 + hash(k, 3) * .05, .07 + hash(k, 4) * .06, .05, 30 + k);   // pencil on paper
  const pip = (t, f0, g = .12) => note(ac, bus, f0, t0, t, .16, 'sine', g);
  pip(IN + 24 / 24, 1320, .05);
  pip(T('notice') + .05, 660, .06);
  note(ac, bus, 520, t0, T('nudge'), .09, 'triangle', .22); noiseBurst(ac, bus, t0, T('nudge') + .02, .2, .05, 9);
  note(ac, bus, 220, t0, T('stare') - .3, .5, 'sine', .12); note(ac, bus, 196, t0, T('stare') + .15, .7, 'sine', .1);
  noiseBurst(ac, bus, t0, T('shove'), .12, .12, 11);
  const o = ac.createOscillator(), e = ac.createGain(), tf = T('shove') + tEdge;            // falling whistle
  o.type = 'sine'; o.frequency.setValueAtTime(1100, t0 + tf); o.frequency.exponentialRampToValueAtTime(260, t0 + tLand);
  e.gain.setValueAtTime(0, t0 + tf); e.gain.linearRampToValueAtTime(.06, t0 + tf + .05); e.gain.linearRampToValueAtTime(0, t0 + tLand);
  o.connect(e); e.connect(bus); o.start(t0 + tf); o.stop(t0 + tLand + .05);
  noiseBurst(ac, bus, t0, tLand, .55, .5, 12);                                            // the crash
  for (let k = 0; k < 7; k++) note(ac, bus, pentHz(2 + (k % 2), k * 3), t0, tLand + .03 + k * .045 + hash(k, 8) * .03, .25, 'triangle', .07);
  [0, 4, 7].forEach((st, k) => note(ac, bus, 330 * Math.pow(2, st / 12), t0, T('turn2') + .5 + k * .08, 1.6, 'sine', .05));
}

const POSE = new URLSearchParams(location.search).get('pose');
function still(c) {
  paper(c, '#f4efe3', null, 87); c.save(); cam(c, 1090, 520, 1.34);
  drawCel(c, DSET, opt); c.save(); c.translate(X0, 700); drawCel(c, DMUG, opt); c.restore();
  c.save(); c.translate(1030, 700); drawCel(c, compileCel(RAW[POSE], {id:POSE}), opt); c.restore(); c.restore();
}
defineFilm({palette:{...PALETTES.pencilMinimal, paper:'#f4efe3'}, format:{ar:'16:9', width:1920}, fps:24, score: POSE ? null : score,
  timeline: POSE ? [{name:'pose ' + POSE, dur:1, fn:still}] : [{name:'cat-and-mug', dur:DUR, fn:shot}]});
</script>
